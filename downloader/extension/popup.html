<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-i18n="extName"></title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <img src="icons/icon-32.png" alt="" width="20" height="20" />
      <h1 data-i18n="extName"></h1>
    </header>

    <p class="status" id="status" data-i18n="statusLoading"></p>

    <form id="form" hidden>
      <div class="modes" role="radiogroup" data-i18n-aria-label="labelMode">
        <label class="mode"
          ><input type="radio" name="mode" value="app" checked /><span data-i18n="modeApp"></span
        ></label>
        <label class="mode"
          ><input type="radio" name="mode" value="general" /><span data-i18n="modeGeneral"></span
        ></label>
      </div>

      <div class="field" id="videoField" hidden>
        <label for="videoSelect" data-i18n="labelVideo"></label>
        <select id="videoSelect" class="control control--ltr"></select>
      </div>

      <div class="field" id="youtubeField" hidden>
        <label for="youtubeUrl" data-i18n="labelVideoLink"></label>
        <input id="youtubeUrl" class="control control--ltr" readonly />
      </div>

      <div class="field" id="pdfField" hidden>
        <label for="pdfUrl" data-i18n="labelPdf"></label>
        <input id="pdfUrl" class="control control--ltr" readonly />
      </div>

      <div class="field" data-mode="general">
        <label for="fileName" data-i18n="labelFileName"></label>
        <input
          id="fileName"
          class="control"
          dir="auto"
          autocomplete="off"
          data-i18n-placeholder="placeholderFileName"
        />
      </div>

      <div class="field" data-mode="general">
        <label for="folder" data-i18n="labelFolder"></label>
        <div class="folder-row">
          <input id="folder" class="control control--ltr" readonly />
          <button
            type="button"
            id="chooseFolder"
            class="btn btn--ghost"
            data-i18n="btnChooseFolder"
          ></button>
        </div>
      </div>

      <div class="field" data-mode="app">
        <label for="course" data-i18n="labelCourse"></label>
        <input
          id="course"
          class="control"
          list="courses-list"
          dir="auto"
          autocomplete="off"
          data-i18n-placeholder="placeholderCourse"
        />
        <datalist id="courses-list"></datalist>
      </div>

      <fieldset id="kinds" class="field kinds" data-mode="app">
        <legend data-i18n="labelKind"></legend>
        <label class="kind"
          ><input type="radio" name="kind" value="lecture" checked /><span
            data-i18n="kindLecture"
          ></span
        ></label>
        <label class="kind"
          ><input type="radio" name="kind" value="recitation" /><span
            data-i18n="kindRecitation"
          ></span
        ></label>
      </fieldset>

      <div class="field" data-mode="app">
        <label for="lecture" data-i18n="labelName"></label>
        <input
          id="lecture"
          class="control"
          list="lectures-list"
          dir="auto"
          autocomplete="off"
          data-i18n-placeholder="placeholderLecture"
        />
        <datalist id="lectures-list"></datalist>
      </div>

      <button type="submit" id="submit" class="btn btn--primary" data-i18n="btnDownload"></button>

      <p class="result" id="result" role="status" hidden>
        <span class="result-headline" id="resultHeadline"></span>
        <span class="result-detail" id="resultDetail" dir="auto"></span>
      </p>
    </form>

    <script src="bridge.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
