[project]
name = "faststudy-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# A single-module distribution, not a package: `py-modules` claims exactly the top-level name
# `tools`, so every consumer's `import tools` line resolves here and `tests/` never lands on
# `sys.path` beside it.
[tool.setuptools]
py-modules = ["tools"]
