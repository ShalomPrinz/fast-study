[project]
name = "faststudy-runtime"
version = "0.1.0"
requires-python = ">=3.11"
# starlette, not fastapi: the module imports starlette.responses and nothing from fastapi, so
# declaring fastapi here would leave starlette arriving only transitively, one pin shift from broken.
dependencies = [
    "starlette>=0.37",
    "uvicorn[standard]>=0.29",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
    # Only the tests build a FastAPI app — the middleware itself is plain ASGI.
    "fastapi>=0.111",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# A single-module distribution, not a package: `py-modules` claims exactly the top-level name
# `runtime`, so every consumer's `import runtime` line stays as it was and `tests/` never lands on
# `sys.path` beside it.
[tool.setuptools]
py-modules = ["runtime"]
