[project]
name = "faststudy-runtime"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# A single-module distribution, not a package: `py-modules` is what lets runtime.js sit in this
# same directory without setuptools' auto-discovery refusing the build, and it claims exactly the
# top-level name `runtime` so every consumer's `import runtime` line stays as it was.
[tool.setuptools]
py-modules = ["runtime"]
