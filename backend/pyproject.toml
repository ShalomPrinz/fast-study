[project]
name = "fast-study-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-dotenv>=1.0",
    "groq>=0.9",
    "requests>=2.31",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-genai>=0.3",
    "apscheduler>=3.10",
    "faststudy-runtime",
    "faststudy-logging",
    "faststudy-tools",
]

[tool.uv.sources]
faststudy-runtime = { path = "../lib/runtime", editable = true }
faststudy-logging = { path = "../lib/logging", editable = true }
faststudy-tools = { path = "../lib/tools", editable = true }

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pymupdf>=1.24",
    "httpx2>=2.10",
]

[tool.pytest.ini_options]
# Tests are grouped into per-package subdirs (tests/course, tests/pipeline,
# tests/services) that mirror the source layout, so two modules can share a
# basename (pipeline/test_runner.py + course/test_runner.py). The default
# "prepend" import mode errors on duplicate basenames and would also shadow the
# real course/pipeline/services packages if the test dirs had __init__.py;
# importlib keys modules by full path and needs no __init__.py, avoiding both.
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Flat layout with multiple top-level dirs — list packages explicitly so
# setuptools doesn't refuse the build on ambiguous auto-discovery (assets/ is
# data, not a package).
[tool.setuptools]
packages = ["course", "pipeline", "services", "timing"]
