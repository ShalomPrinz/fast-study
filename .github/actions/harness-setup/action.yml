name: Harness setup
description: Toolchain and dependencies the app harness needs (uv, Node, ffmpeg, pandoc, tectonic with a warm cache, npm deps, headless Chromium). Run after checkout; the caller sets UV_PYTHON.

inputs:
  tectonic-version:
    description: Tectonic release to install (delivery ships this one).
    default: '0.17.0'

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v5

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: |
          package-lock.json
          frontend/package-lock.json
          downloader/package-lock.json

    - name: Install ffmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
      shell: bash

    # The version the backend tests and the shipped build pin: the summary render needs pandoc >= 2.10 (colspecs API).
    - name: Install pandoc 3.13
      run: |
        curl -fsSL -o pandoc.deb https://github.com/jgm/pandoc/releases/download/3.13/pandoc-3.13-1-amd64.deb
        sudo dpkg -i pandoc.deb
        pandoc --version | head -1
      shell: bash

    # The version delivery ships; the musl build is static, so it needs no system libraries.
    - name: Install tectonic
      env:
        TECTONIC_VERSION: ${{ inputs.tectonic-version }}
      run: |
        mkdir -p "$RUNNER_TEMP/tectonic"
        curl -fsSL "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40$TECTONIC_VERSION/tectonic-$TECTONIC_VERSION-x86_64-unknown-linux-musl.tar.gz" \
          | tar -xz -C "$RUNNER_TEMP/tectonic"
        echo "$RUNNER_TEMP/tectonic" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/tectonic/tectonic" --version
      shell: bash

    - uses: actions/cache@v4
      with:
        path: ~/.cache/Tectonic
        key: tectonic-${{ inputs.tectonic-version }}-${{ hashFiles('backend/pipeline/to_pdf.py') }}
        restore-keys: tectonic-${{ inputs.tectonic-version }}-

    # A cold cache fetches the LaTeX bundle here, not inside a spec, by mirroring to_pdf.py's build_tex
    # (header, fonts, pandoc template, filter and flags) over the fixture summary the PDF spec renders.
    - name: Warm the tectonic cache
      run: |
        build="$RUNNER_TEMP/tectonic-warmup"
        mkdir -p "$build"
        cp backend/assets/fonts/*.ttf "$build/"
        python3 - backend/pipeline/to_pdf.py "$build/header.tex" <<'EOF'
        import re, sys
        src = open(sys.argv[1], encoding="utf-8").read()
        header = re.search(r'LATEX_HEADER = r"""(.*?)"""', src, re.S).group(1)
        open(sys.argv[2], "w", encoding="utf-8").write(header.replace("FONTS_DIR_PLACEHOLDER", "./"))
        EOF
        cp .claude/harness/fixtures/summary.md "$build/input.md"
        cd "$build"
        pandoc input.md -o build.tex --from=markdown-smart --to=latex-smart \
          --template="$GITHUB_WORKSPACE/backend/assets/templates/pandoc_template.tex" \
          -V geometry:margin=2.5cm -V linestretch=1.3 --include-in-header=header.tex \
          --lua-filter="$GITHUB_WORKSPACE/backend/assets/filters/text_direction.lua" --standalone
        time tectonic --keep-logs -Z continue-on-errors build.tex
        test -s build.pdf
        if grep -n '^! Font' build.log; then exit 1; fi
      shell: bash

    # The self-check stats the repo-root .env (never reads it), and the file is gitignored.
    - name: Install dependencies
      run: |
        touch .env
        npm ci
        npm ci --prefix frontend
        (cd downloader && npm ci --install-links)
      shell: bash

    - id: playwright
      name: Read the Playwright version
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      shell: bash

    - uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

    # --with-deps for the system libraries the shell links against, which the runner image may lack.
    - name: Install the headless Chromium
      run: npx playwright install --with-deps chromium --only-shell
      shell: bash
