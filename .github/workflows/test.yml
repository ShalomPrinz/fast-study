name: Test

on:
  push:

jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      # Keep in step with build.yml's TECTONIC_VERSION, the version the shipped LaTeX cache was primed against.
      TECTONIC_VERSION: '0.17.0'
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      # pandoc and tectonic drive the render tests (the LaTeX golden, the text_direction.lua cases, the font allowlist and the Hebrew code-block render); without them they skip.
      # Pin pandoc to the shipped 3.13: its LaTeX output differs across versions, so the golden is only valid for one.
      - name: Install pandoc 3.13
        run: |
          curl -fsSL --retry 5 --retry-delay 10 -o pandoc.deb https://github.com/jgm/pandoc/releases/download/3.13/pandoc-3.13-1-amd64.deb
          sudo dpkg -i pandoc.deb
          pandoc --version | head -1

      - name: Install tectonic
        run: |
          mkdir -p "$RUNNER_TEMP/tectonic"
          curl -fsSL --retry 5 --retry-delay 10 "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40$TECTONIC_VERSION/tectonic-$TECTONIC_VERSION-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/tectonic"
          echo "$RUNNER_TEMP/tectonic" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tectonic/tectonic" --version

      - uses: actions/cache@v5
        with:
          path: ~/.cache/tectonic
          key: tectonic-backend-${{ env.TECTONIC_VERSION }}-${{ hashFiles('backend/pipeline/to_pdf.py') }}
          restore-keys: tectonic-backend-${{ env.TECTONIC_VERSION }}-

      # uv reads .python-version + pyproject.toml; fetches Python 3.12 and builds
      # the venv with the test extra.
      - name: Sync dependencies
        run: uv sync --extra test

      - name: Run tests
        run: uv run pytest tests/ -q -rs

  database-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: database
    env:
      # database/ carries no .python-version of its own, so pin the interpreter here — otherwise a
      # runner image bump silently moves the version the suite runs on.
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      # Needs the whole repo checked out, not just database/: two of its dependencies are editable
      # path deps on ../lib/*/py.
      - name: Sync dependencies
        run: uv sync --extra test

      - name: Run tests
        run: uv run pytest tests/ -q

  frontend-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  downloader-tests:
    runs-on: ubuntu-24.04
    env:
      # Both suites are unit tests over the extractors and the express routes; neither launches a
      # browser, so skip playwright's browser download rather than pay for it on every run.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: downloader/package-lock.json

      # One workspace install for both packages — one lock, one hoisted node_modules. Their file: deps
      # on ../../lib/*/js come from the full checkout; --install-links (also set in downloader/.npmrc)
      # copies them as real directories, the shape delivery/stage.mjs ships: a symlinked lib package
      # resolves its own dependencies from its real path, so @faststudy/tools would not find @faststudy/runtime.
      - name: Install downloader dependencies
        run: npm ci --install-links
        working-directory: downloader

      - name: Run server tests
        run: npm test
        working-directory: downloader/server

      - name: Run auto tests
        run: npm test
        working-directory: downloader/auto

  electron-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: electron
    env:
      # The suite is pure logic over a fake `electron` module, so it only needs the package
      # resolvable — never the ~100MB platform binary electron's postinstall would fetch.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # The repo's internal tooling: the shared lib packages, which fail as a unit because a break in any
  # of them is live in four services at once, then the app harness's unit tests.
  internal-tests:
    runs-on: ubuntu-24.04
    env:
      # No .python-version under lib/ either — see database-tests.
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Each Python half is its own uv project with its own lock, so it syncs and runs in place.
      - name: Run runtime (py) tests
        run: uv sync --extra test && uv run pytest tests/ -q
        working-directory: lib/runtime/py

      - name: Run tools (py) tests
        run: uv sync --extra test && uv run pytest tests/ -q
        working-directory: lib/tools/py

      - name: Run logging (py) tests
        run: uv sync --extra test && uv run pytest tests/ -q
        working-directory: lib/logging/py

      - name: Run sentry (py) tests
        run: uv sync --extra test && uv run pytest tests/ -q
        working-directory: lib/sentry/py

      # Both JS halves are npm workspaces of the repo root ("lib/*/js"), so one root install covers
      # them. --workspaces without --if-present on purpose: a new lib/*/js with no test script
      # should fail here rather than pass by being skipped.
      - name: Install JS workspace dependencies
        run: npm ci

      - name: Run runtime, tools and sentry (js) tests
        run: npm test --workspaces

      # The harness's own logic, no stack: its tests import only node: builtins and harness files.
      - name: Run harness (js) tests
        run: node --test '.claude/harness/tests/*.test.mjs'

      - name: Run harness shim (py) tests
        run: uvx pytest .claude/harness/tests -q
