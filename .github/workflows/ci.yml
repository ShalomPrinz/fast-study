name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # match local python version
          python-version: "3.10.12"

      # pandoc drives the ltr_code.lua integration tests in test_to_pdf.py;
      # without it those tests skip instead of running. Pin to 2.9.2.1 to match
      # the local dev version — pandoc's LaTeX output differs across versions.
      - name: Install pandoc 2.9.2.1
        run: |
          curl -fsSL -o pandoc.deb https://github.com/jgm/pandoc/releases/download/2.9.2.1/pandoc-2.9.2.1-1-amd64.deb
          sudo dpkg -i pandoc.deb
          pandoc --version | head -1

      - name: Install backend
        run: pip install -e ".[test]"

      - name: Run tests
        run: python3 -m pytest tests/ -q
