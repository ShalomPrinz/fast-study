name: Publish

# Manual only, no input, and it builds nothing: it releases the `installer` artifact of build.yml's
# green run for the dispatched commit — the bytes the smoke job tested — as Release v<version>,
# which is the moment every installed copy's updater can see it.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    # Two dispatches would race between the existence check and the create.
    concurrency:
      group: release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - name: Release the tested installer
        run: |
          version=$(node -p "require('./electron/package.json').version")
          tag="v$version"
          if view=$(gh release view "$tag" --json isDraft 2> view.err); then
            echo "::error::a Release $tag already exists (draft: $(jq -r .isDraft <<< "$view")); bump electron/package.json's version"
            exit 1
          elif ! grep -q "release not found" view.err; then
            cat view.err
            exit 1
          fi
          # Creating the Release creates the tag at the target; one that already exists would be reused as-is.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::tag $tag already exists"
            exit 1
          fi

          # A run's conclusion is success only when every job passed, smoke included.
          run=$(gh run list --workflow build.yml --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run" ]; then
            echo "::error::no successful build.yml run for $GITHUB_SHA; dispatch build.yml on this commit, then publish again"
            exit 1
          fi
          if ! gh api "repos/$GH_REPO/actions/runs/$run/artifacts" --jq '.artifacts[] | select(.name == "installer" and (.expired | not)) | .id' | grep -q .; then
            echo "::error::the installer artifact of build.yml run $run for $GITHUB_SHA has expired; dispatch build.yml on this commit, then publish again"
            exit 1
          fi
          gh run download "$run" -n installer -D installer

          files=("installer/FastStudy-Setup-$version.exe" "installer/FastStudy-Setup-$version.exe.blockmap" installer/latest.yml)
          for file in "${files[@]}"; do
            [ -f "$file" ] || { echo "::error::build.yml run $run's installer artifact has no ${file#installer/}"; ls -l installer; exit 1; }
          done

          gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --title "$tag" --notes "" --latest
          echo "published $tag at $GITHUB_SHA from build.yml run $run"
