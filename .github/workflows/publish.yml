name: Publish

# Manual only, no input, and it builds nothing: it releases the `installer` artifact of main's green
# build.yml run for the dispatched commit, or the one below pages.yml's screenshot commits — the bytes
# the smoke job tested — as Release v<version>, the version build.yml computed and wrote into its
# latest.yml. That is the moment every installed copy's updater can see it.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    # Two dispatches would race between the existence check and the create.
    concurrency:
      group: release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pages.yml's screenshot refresh pushes a bot commit build.yml never runs on, so release the
      # newest commit below HEAD that is not one: skip only bot commits touching nothing but site/img/.
      - name: Resolve the release commit
        id: target
        run: |
          bot='github-actions[bot] <41898783+github-actions[bot]@users.noreply.github.com>'
          sha=$GITHUB_SHA
          skipped=()
          while [ "$(git log -1 --format='%an <%ae>' "$sha")" = "$bot" ] \
            && [ "$(git rev-list --parents -n 1 "$sha" | wc -w)" -eq 2 ] \
            && paths=$(git diff-tree --no-commit-id --name-only -r "$sha^" "$sha") \
            && [ -n "$paths" ] && ! grep -qv '^site/img/' <<< "$paths"; do
            skipped+=("$sha")
            sha=$(git rev-parse "$sha^")
          done
          if [ ${#skipped[@]} -gt 0 ]; then
            echo "skipped screenshot commits ${skipped[*]}; releasing $sha"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Release the tested installer
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          # A run's conclusion is success only when every job passed, smoke included.
          # Only main's runs: a claude/** branch run of the same commit is built without SENTRY_AUTH_TOKEN.
          run=$(gh run list --workflow build.yml --branch main --commit "$TARGET_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run" ]; then
            echo "::error::no successful main build.yml run for $TARGET_SHA; dispatch build.yml on main at this commit, then publish again"
            exit 1
          fi
          if ! gh api "repos/$GH_REPO/actions/runs/$run/artifacts" --jq '.artifacts[] | select(.name == "installer" and (.expired | not)) | .id' | grep -q .; then
            echo "::error::the installer artifact of build.yml run $run for $TARGET_SHA has expired; dispatch build.yml on main at this commit, then publish again"
            exit 1
          fi
          gh run download "$run" -n installer -D installer

          # build.yml computes the version, and latest.yml carries it — the same line installed copies read.
          version=$(sed -n 's/^version:[[:space:]]*\([^[:space:]]*\)[[:space:]]*$/\1/p' installer/latest.yml 2> /dev/null)
          if [ -z "$version" ]; then
            echo "::error::build.yml run $run's installer artifact has no latest.yml version line"
            ls -l installer
            exit 1
          fi
          tag="v$version"
          if view=$(gh release view "$tag" --json isDraft 2> view.err); then
            echo "::error::a Release $tag already exists (draft: $(jq -r .isDraft <<< "$view")); dispatch build.yml on main at this commit to build a fresh version, then publish again"
            exit 1
          elif ! grep -q "release not found" view.err; then
            cat view.err
            exit 1
          fi
          # Creating the Release creates the tag at the target; one that already exists would be reused as-is.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::tag $tag already exists"
            exit 1
          fi

          # The file name is fixed so releases/latest/download/FastStudy-Setup.exe stays a stable link.
          # extension-version.txt is what the next build bumps the packaged extension's version from.
          files=(installer/FastStudy-Setup.exe installer/FastStudy-Setup.exe.blockmap installer/latest.yml installer/extension-version.txt)
          for file in "${files[@]}"; do
            [ -f "$file" ] || { echo "::error::build.yml run $run's installer artifact has no ${file#installer/}"; ls -l installer; exit 1; }
          done
          # The smoke job's boot timings, for the cross-version graph; optional, since older runs have none.
          if gh run download "$run" -n boot-timing -D boot-timing && [ -f boot-timing/boot-timing.json ]; then
            files+=(boot-timing/boot-timing.json)
          else
            echo "::notice::build.yml run $run has no boot-timing artifact; releasing without boot-timing.json"
          fi

          gh release create "$tag" "${files[@]}" --target "$TARGET_SHA" --title "$tag" --notes "" --latest
          echo "published $tag at $TARGET_SHA from build.yml run $run"

      # A release event raised by GITHUB_TOKEN starts no workflow, so the landing page's version line
      # is refreshed by dispatch — the one event that token may raise.
      - name: Refresh the landing page
        run: |
          if ! gh workflow run pages.yml --ref main; then
            echo "::error::the Release is published; run pages.yml by hand: gh workflow run pages.yml --ref main, or from the Actions tab"
            exit 1
          fi
