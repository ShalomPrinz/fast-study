name: E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The app-harness Playwright specs against one live offline stack: real ffmpeg, pandoc and
  # tectonic, every third party faked.
  harness-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: '3.12'
    steps:
      # Here rather than in the job's env, where the runner context is not yet available.
      - name: Set the harness root
        run: echo "HARNESS_DIR=$RUNNER_TEMP/harness" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      # Toolchain, caches, npm deps and Chromium; UV_PYTHON above feeds its uv.
      - uses: ./.github/actions/harness-setup

      # Returns once the stack is ready and leaves it running; a failed self-check fails the step.
      - name: Start the harness
        run: node .claude/harness/setup.mjs --harness "$HARNESS_DIR"

      - name: Run the e2e specs
        run: npm run test:e2e

      # Fails the job when a spec reached past loopback; the tectonic warm-up ran outside the stack.
      - name: Check for network escapes
        if: always()
        run: node .claude/harness/hb.mjs --harness "$HARNESS_DIR" refused

      - name: Stop the harness
        if: always()
        run: node .claude/harness/setup.mjs --harness "$HARNESS_DIR" --down

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: harness-e2e
          path: |
            ${{ runner.temp }}/harness/logs
            ${{ runner.temp }}/harness/evidence
          if-no-files-found: ignore
