name: Build and smoke-test

# Every push to main or a claude/** branch, plus a dispatch to rebuild a commit.
# Builds the Windows installer and the macOS arm64 app once each and smoke-tests those exact bytes
# on fresh runners; it never publishes.
# publish.yml takes main's newest green run's `installer` and `installer-mac` for the release commit.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

# Only the newest push on a ref builds; a superseded run is cancelled rather than queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, because each one is a claim the repo has measured. tectonic is the version the shipped
  # LaTeX cache was primed against; pandoc's stock template is backend/assets/templates/ and its Lua
  # table API is what text_direction.lua reads, so the three only ever move together.
  TECTONIC_VERSION: '0.17.0'
  PANDOC_VERSION: '3.13'
  FFMPEG_VERSION: '9.0.2'
  # Pinned so the bootloader check below compares against the same version's stock wheel.
  PYINSTALLER_VERSION: '6.22.3'
  # The macOS ffmpeg is built from source at FFMPEG_VERSION with this LAME, both tarballs pinned by
  # sha256 — delivery/docs/RELEASE.md#the-macos-ffmpeg.
  FFMPEG_SHA256: 8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e
  LAME_VERSION: '3.100'
  LAME_SHA256: ddfe36cab873794038ae2c1210557ad34857a4b6bdc515785d1da9e175b1da1e
  STAGE: delivery/stage

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    # build-mac ships the same app version and the same extension version, so it reads both here.
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.version.outputs.previous }}
      extension: ${{ steps.extension.outputs.version }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Every external tool the app spawns, by absolute path out of FASTSTUDY_BIN_DIR at runtime.
      # curl is the one exception and ships with Windows, so it is not here.
      # The prime's two come first so it starts ahead of the GitHub API steps.
      # The msvc tectonic build, never gnu: the gnu binary imports six MinGW DLLs its own zip does
      # not contain.
      - name: Download tectonic and pandoc
        run: |
          mkdir -p "$STAGE/bin" downloads
          base=https://github.com
          curl -fsSL --retry 5 --retry-delay 10 -o downloads/tectonic.zip "$base/tectonic-typesetting/tectonic/releases/download/tectonic%40$TECTONIC_VERSION/tectonic-$TECTONIC_VERSION-x86_64-pc-windows-msvc.zip"
          curl -fsSL --retry 5 --retry-delay 10 -o downloads/pandoc.zip "$base/jgm/pandoc/releases/download/$PANDOC_VERSION/pandoc-$PANDOC_VERSION-windows-x86_64.zip"
          for zip in tectonic pandoc; do 7z x -y -o"downloads/$zip" "downloads/$zip.zip" > /dev/null; done
          cp downloads/tectonic/tectonic.exe "$STAGE/bin/"
          cp "downloads/pandoc/pandoc-$PANDOC_VERSION/pandoc.exe" "$STAGE/bin/"

      # Exact key over every prime input, no restore-keys — delivery/docs/LATEX.md#across-runs.
      - name: Restore the LaTeX cache
        id: latex-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.STAGE }}/latex
          key: latex-${{ runner.os }}-tectonic${{ env.TECTONIC_VERSION }}-pandoc${{ env.PANDOC_VERSION }}-${{ hashFiles('delivery/prime_cache.py', 'delivery/kitchen-sink.md', 'delivery/probe.png', 'delivery/probe.pdf', 'delivery/cache-supplement.txt', 'backend/pipeline/to_pdf.py', 'backend/pipeline/pdf/**', 'backend/assets/templates/**', 'backend/assets/filters/**', 'backend/assets/fonts/**') }}

      # Network-bound, ~7.5 minutes cold; over a restored cache a top-up, run anyway as the strict proof.
      # tectonic fetches each LaTeX package on first use and the shipped app renders --only-cached,
      # so anything missing here is an unfixable failed render on a user's machine. It runs in the
      # background beside the CPU-bound freeze and frontend build, writing its exit code to a file
      # last, since a later step's shell cannot `wait` on it.
      # The foreground sync keeps the freeze's own `uv run` off a .venv still being built.
      - name: Start the LaTeX cache prime
        working-directory: backend
        env:
          FASTSTUDY_BIN_DIR: ${{ github.workspace }}/delivery/stage/bin
          CACHE_HIT: ${{ steps.latex-cache.outputs.cache-hit }}
        run: |
          echo "LaTeX cache hit: ${CACHE_HIT:-false}, $(find "../$STAGE/latex" -type f 2>/dev/null | wc -l) files restored"
          uv sync
          nohup bash -c 'uv run python ../delivery/prime_cache.py "../$STAGE/latex"; echo $? > "$RUNNER_TEMP/prime.exit.tmp"; mv "$RUNNER_TEMP/prime.exit.tmp" "$RUNNER_TEMP/prime.exit"' > "$RUNNER_TEMP/prime.log" 2>&1 < /dev/null &
          echo "prime started as pid $!, logging to $RUNNER_TEMP/prime.log"

      # Nothing spawns ffprobe, so the ffmpeg zip's second binary — 105MB unpacked — stays behind.
      - name: Download ffmpeg and yt-dlp
        run: |
          base=https://github.com
          curl -fsSL --retry 5 --retry-delay 10 -o downloads/ffmpeg.zip "$base/GyanD/codexffmpeg/releases/download/$FFMPEG_VERSION/ffmpeg-$FFMPEG_VERSION-essentials_build.zip"
          # Unpinned on purpose: yt-dlp rots as YouTube changes signatures, so a build ships the
          # newest one and the app self-updates from there.
          curl -fsSL --retry 5 --retry-delay 10 -o "$STAGE/bin/yt-dlp.exe" "$base/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
          7z x -y -o"downloads/ffmpeg" "downloads/ffmpeg.zip" > /dev/null
          cp "downloads/ffmpeg/ffmpeg-$FFMPEG_VERSION-essentials_build/bin/ffmpeg.exe" "$STAGE/bin/"
          ls -l "$STAGE/bin"

      # The tag, the installer's file name and what app.getVersion() reports; the update check's
      # second installer needs any version below it, so this refuses a version with nothing below.
      # Major and minor come from electron/package.json, whose patch is ignored: the patch is one
      # past the highest non-draft Release tagged v<major>.<minor>.<n>, or 0 when there is none.
      - name: Read the version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          base=$(node -p "require('./electron/package.json').version")
          # Drafts are invisible to this token and reserve no tag; a prerelease's tag is taken, so it counts.
          tags=$(gh api "repos/$GH_REPO/releases" --paginate --jq '.[] | select(.draft | not) | .tag_name')
          version=$(node -e '
            const [, major, minor] = /^(\d+)\.(\d+)\./.exec(process.argv[1]) ?? process.exit(1);
            const tag = new RegExp(`^v${major}\\.${minor}\\.(0|[1-9]\\d*)$`);
            const patches = process.argv[2].split("\n").map((t) => tag.exec(t.trim())?.[1]).filter(Boolean).map(Number);
            console.log(`${major}.${minor}.${patches.length ? Math.max(...patches) + 1 : 0}`);
          ' "$base" "$tags") || { echo "::error::electron/package.json's version $base has no major.minor"; exit 1; }
          previous=$(node -e '
            const [major, minor, patch] = process.argv[1].split(/[.-]/).map(Number);
            if (patch > 0) console.log(`${major}.${minor}.${patch - 1}`);
            else if (minor > 0) console.log(`${major}.${minor - 1}.9999`);
            else if (major > 0) console.log(`${major - 1}.9999.9999`);
            else process.exit(1);
          ' "$version") || { echo "::error::$version has no lower version to update from"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "building $version, with $previous for the update check"

      # The staged extension's manifest version, which Chrome's copy is replaced on: the newest
      # non-draft Release's, plus one patch when a shipped extension file changed since its tag.
      # That Release's extension-version.txt records it; delivery/extension-version.mjs is the rule.
      - name: Read the extension version
        id: extension
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest=$(gh api "repos/$GH_REPO/releases" --paginate --jq '.[] | select(.draft | not) | .tag_name' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1)
          recorded=
          if [ -n "$latest" ]; then
            # The checkout is shallow; the diff needs that Release's tree too.
            git fetch --no-tags --depth=1 origin tag "$latest"
            assets=$(gh release view "$latest" --json assets --jq '.assets[].name')
            if grep -qx extension-version.txt <<< "$assets"; then
              gh release download "$latest" -p extension-version.txt -D "$RUNNER_TEMP/previous-release"
              recorded=$(tr -d '[:space:]' < "$RUNNER_TEMP/previous-release/extension-version.txt")
            fi
          fi
          version=$(node delivery/extension-version.mjs "$latest" "$recorded")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "shipping extension $version against ${latest:-no previous release}"

      # The one build input that is not committed: it is gitignored so the client secret never
      # faces GitHub's secret scanning. Required — an installer without it cannot connect Drive.
      - name: Write credentials.json
        env:
          CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          if [ -z "$CREDENTIALS" ]; then
            echo "::error::GOOGLE_CREDENTIALS_JSON secret is empty or unset — set it to the Google OAuth client JSON; a build without it cannot connect Google Drive"
            exit 1
          fi
          printf '%s' "$CREDENTIALS" > backend/credentials.json
          echo "credentials.json written"

      # One one-dir bundle holding both Python services, selected by argv[1]. Built out of
      # backend/'s environment, which works only because database/'s dependencies are a strict
      # subset of backend/'s.
      # PyInstaller installs from its sdist with the bootloader compiled here by MSVC: the stock
      # prebuilt one is shared with malware and Defender quarantines it. The sdist also carries the
      # stock run.exe, used unless PYINSTALLER_COMPILE_BOOTLOADER is set — hence the check after.
      - name: Freeze backend and database
        working-directory: backend
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: '1'
        run: |
          pyi=(--with "pyinstaller==$PYINSTALLER_VERSION" --no-binary-package pyinstaller)
          uv run "${pyi[@]}" pyinstaller ../delivery/services.spec
          ours=$(uv run "${pyi[@]}" python -c "import PyInstaller, hashlib, pathlib; print(hashlib.sha256((pathlib.Path(PyInstaller.__file__).parent / 'bootloader/Windows-64bit-intel/run.exe').read_bytes()).hexdigest())")
          wheel=$(curl -fsSL --retry 5 --retry-delay 10 "https://pypi.org/pypi/pyinstaller/$PYINSTALLER_VERSION/json" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0)).urls.find((u) => u.filename.endsWith("-win_amd64.whl")).url)')
          curl -fsSL --retry 5 --retry-delay 10 -o "$RUNNER_TEMP/pyinstaller.whl" "$wheel"
          stock=$(7z e -so "$RUNNER_TEMP/pyinstaller.whl" PyInstaller/bootloader/Windows-64bit-intel/run.exe | sha256sum | cut -d' ' -f1)
          echo "bootloader run.exe: ours $ours, stock $stock"
          [ "$ours" != "$stock" ] || { echo "::error::faststudy-services.exe would carry PyInstaller's stock bootloader"; exit 1; }

      # With the token, vite uploads hidden source maps to faststudy@<version>, then deletes them.
      # Only main gets the token: a branch computes the version main's next build will use.
      # Built once: the previous-version installer reuses this bundle, so there is one upload.
      - name: Build the frontend
        working-directory: frontend
        env:
          FASTSTUDY_VERSION: ${{ steps.version.outputs.version }}
          SENTRY_AUTH_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.SENTRY_AUTH_TOKEN || '' }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          VITE_SENTRY_DSN: ${{ secrets.FASTSTUDY_SENTRY_DSN }}
        run: npm ci && npm run build

      # One workspace install, so auto and server share one hoisted node_modules. downloader/.npmrc's
      # install-links makes the file:../lib/*/js deps real directories, not links that dangle once
      # the tree is copied into the installer.
      # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD keeps a 364MB Chromium the app never launches — every
      # launch resolves channel:'chrome' or 'msedge' — out of the installer.
      - name: Install the Node services
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        # A subshell rather than `npm --prefix`: run from the repo root, npm would pick up the root
        # package.json's `lib/*/js` workspaces instead of downloader's.
        run: (cd downloader && npm ci --omit=dev --no-audit --no-fund)

      # The prime started in the background above; its log prints here whatever the outcome.
      - name: Wait for the LaTeX cache prime
        run: |
          done="$RUNNER_TEMP/prime.exit"
          deadline=$((SECONDS + 2400))
          until [ -f "$done" ] || [ "$SECONDS" -ge "$deadline" ]; do sleep 5; done
          cat "$RUNNER_TEMP/prime.log"
          [ -f "$done" ] || { echo "::error::the LaTeX cache prime did not finish within 40 minutes"; exit 1; }
          code=$(cat "$done")
          [ "$code" = 0 ] || { echo "::error::the LaTeX cache prime exited $code"; exit 1; }

      # Right after a passed wait, so a failed or partial prime is never saved; a hit's key already exists.
      - name: Save the LaTeX cache
        if: steps.latex-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.STAGE }}/latex
          key: ${{ steps.latex-cache.outputs.cache-primary-key }}

      - name: Assemble the resources tree
        run: node delivery/stage.mjs "$STAGE" "${{ steps.extension.outputs.version }}"

      # `dist` lives in electron/package.json with the publish block that writes app-update.yml and
      # latest.yml; --publish never is in the script, so this step can upload nothing.
      # The DSN is stamped into the asar's package.json as sentryDsn, and only when the secret is set:
      # without it the key is absent and the app initialises no Sentry anywhere.
      - name: Build the installer
        working-directory: electron
        env:
          SENTRY_DSN: ${{ secrets.FASTSTUDY_SENTRY_DSN }}
        run: |
          dsn=()
          [ -n "$SENTRY_DSN" ] && dsn=("-c.extraMetadata.sentryDsn=$SENTRY_DSN")
          npm ci && npm run dist -- "-c.extraMetadata.version=${{ steps.version.outputs.version }}" "${dsn[@]}"

      # Rides in the installer artifact so publish.yml records it on the Release, where the next
      # build's extension version step reads it back.
      - name: Record the extension version
        run: printf '%s\n' "${{ steps.extension.outputs.version }}" > electron/dist/extension-version.txt

      # The smoke job rewrites app-update.yml to a loopback feed, so this is the only check that the
      # shipped copy points installed apps at this repo's Releases.
      - name: Check the update feed config
        run: |
          yml=electron/dist/win-unpacked/resources/app-update.yml
          [ -f "$yml" ] || { echo "::error::electron-builder wrote no $yml"; exit 1; }
          for line in "provider: github" "owner: ShalomPrinz" "repo: fast-study"; do
            grep -qx "$line" <(tr -d '\r' < "$yml") || { echo "::error::$yml has no '$line'"; cat "$yml"; exit 1; }
          done

      # The same staged tree at a lower version, so the smoke job can update from it to the build
      # above. Its own output dir keeps its latest.yml off the candidate's; it never leaves Actions.
      - name: Build the previous-version installer
        working-directory: electron
        env:
          SENTRY_DSN: ${{ secrets.FASTSTUDY_SENTRY_DSN }}
        run: |
          dsn=()
          [ -n "$SENTRY_DSN" ] && dsn=("-c.extraMetadata.sentryDsn=$SENTRY_DSN")
          npm run dist -- "-c.extraMetadata.version=${{ steps.version.outputs.previous }}" -c.directories.output=dist/previous "${dsn[@]}"

      - uses: actions/upload-artifact@v6
        with:
          name: installer
          path: |
            electron/dist/FastStudy-Setup.exe
            electron/dist/FastStudy-Setup.exe.blockmap
            electron/dist/latest.yml
            electron/dist/extension-version.txt
          if-no-files-found: error
          # The public-repo maximum: publish.yml can release this commit until then, and a dispatch
          # of this workflow on it rebuilds one that expired.
          retention-days: 90

      - uses: actions/upload-artifact@v6
        with:
          name: installer-previous
          # Two files in one dir upload flat, so the smoke suite reads its latest.yml as it does the candidate's.
          path: |
            electron/dist/previous/FastStudy-Setup.exe
            electron/dist/previous/latest.yml
          if-no-files-found: error

  # The macOS arm64 app: the same staged tree with darwin tools, ad-hoc signed — never notarized.
  # After `build` only for its version outputs; every step traces (`set -x`) since no Mac can rerun one.
  build-mac:
    needs: build
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      APP: electron/dist/mac-arm64/FastStudy.app

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The official darwin-arm64 releases at the Windows job's pins; curl ships with macOS too.
      - name: Download tectonic and pandoc
        run: |
          set -eux
          mkdir -p "$STAGE/bin" downloads/tectonic downloads/pandoc
          base=https://github.com
          curl -fsSL --retry 5 --retry-delay 10 -o downloads/tectonic.tar.gz "$base/tectonic-typesetting/tectonic/releases/download/tectonic%40$TECTONIC_VERSION/tectonic-$TECTONIC_VERSION-aarch64-apple-darwin.tar.gz"
          curl -fsSL --retry 5 --retry-delay 10 -o downloads/pandoc.zip "$base/jgm/pandoc/releases/download/$PANDOC_VERSION/pandoc-$PANDOC_VERSION-arm64-macOS.zip"
          tar -xzf downloads/tectonic.tar.gz -C downloads/tectonic
          unzip -q downloads/pandoc.zip -d downloads/pandoc
          cp downloads/tectonic/tectonic "$STAGE/bin/"
          cp "downloads/pandoc/pandoc-$PANDOC_VERSION-arm64/bin/pandoc" "$STAGE/bin/"
          chmod +x "$STAGE/bin/tectonic" "$STAGE/bin/pandoc"
          "$STAGE/bin/tectonic" --version
          "$STAGE/bin/pandoc" --version | head -n 1

      # Its own key through runner.os: the cache is primed per platform — delivery/docs/LATEX.md#across-runs.
      - name: Restore the LaTeX cache
        id: latex-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.STAGE }}/latex
          key: latex-${{ runner.os }}-tectonic${{ env.TECTONIC_VERSION }}-pandoc${{ env.PANDOC_VERSION }}-${{ hashFiles('delivery/prime_cache.py', 'delivery/kitchen-sink.md', 'delivery/probe.png', 'delivery/probe.pdf', 'delivery/cache-supplement.txt', 'backend/pipeline/to_pdf.py', 'backend/pipeline/pdf/**', 'backend/assets/templates/**', 'backend/assets/filters/**', 'backend/assets/fonts/**') }}

      # The Windows job's background prime, here beside the ffmpeg compile and the freeze.
      - name: Start the LaTeX cache prime
        working-directory: backend
        env:
          FASTSTUDY_BIN_DIR: ${{ github.workspace }}/delivery/stage/bin
          CACHE_HIT: ${{ steps.latex-cache.outputs.cache-hit }}
        run: |
          set -eux
          echo "LaTeX cache hit: ${CACHE_HIT:-false}, $(find "../$STAGE/latex" -type f 2>/dev/null | wc -l) files restored"
          uv sync
          nohup bash -c 'uv run python ../delivery/prime_cache.py "../$STAGE/latex"; echo $? > "$RUNNER_TEMP/prime.exit.tmp"; mv "$RUNNER_TEMP/prime.exit.tmp" "$RUNNER_TEMP/prime.exit"' > "$RUNNER_TEMP/prime.log" 2>&1 < /dev/null &
          echo "prime started as pid $!, logging to $RUNNER_TEMP/prime.log"

      # Electron's own LSMinimumSystemVersion is the app's, and so the floor ffmpeg is built for. The npm
      # package has no install script, so install.js fetches the locked version's zip — the one electron-builder packs.
      - name: Install the launcher and read its minimum macOS
        id: macos
        working-directory: electron
        run: |
          set -eux
          npm ci
          node node_modules/electron/install.js
          plist=node_modules/electron/dist/Electron.app/Contents/Info.plist
          [ -f "$plist" ] || { echo "::error::Electron's install.js left no $plist"; ls -la node_modules/electron node_modules/electron/dist || true; exit 1; }
          min=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist") || { echo "::error::$plist has no LSMinimumSystemVersion"; exit 1; }
          [[ $min =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "::error::Electron's LSMinimumSystemVersion reads '$min'"; exit 1; }
          echo "min=$min" >> "$GITHUB_OUTPUT"

      # Keyed by everything that shapes the binary: both versions, the deployment target and the script.
      - name: Restore the ffmpeg build
        id: ffmpeg-cache
        uses: actions/cache/restore@v5
        with:
          path: ffmpeg-build/out
          key: ffmpeg-macos-arm64-${{ env.FFMPEG_VERSION }}-lame${{ env.LAME_VERSION }}-min${{ steps.macos.outputs.min }}-${{ hashFiles('delivery/ffmpeg-mac.sh') }}

      - name: Build ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ steps.macos.outputs.min }}
        run: bash delivery/ffmpeg-mac.sh "$PWD/ffmpeg-build"

      # A restored binary is checked too. It may load nothing but macOS itself, must run on the
      # launcher's oldest macOS, and stays LGPL with the encoder, TLS and zlib the app needs.
      - name: Check ffmpeg
        env:
          MIN: ${{ steps.macos.outputs.min }}
        run: |
          set -eux
          ff=ffmpeg-build/out/ffmpeg
          "$ff" -hide_banner -version
          lipo -archs "$ff"
          otool -L "$ff"
          foreign=$(otool -L "$ff" | tail -n +2 | awk '{print $1}' | grep -Ev '^(/usr/lib/|/System/)' || true)
          [ -z "$foreign" ] || { echo "::error::ffmpeg loads libraries outside /usr/lib and /System: $foreign"; exit 1; }
          vtool -show-build "$ff"
          minos=$(vtool -show-build "$ff" | awk '$1 == "minos" {print $2}')
          [ -n "$minos" ] || { echo "::error::vtool reports no minos for ffmpeg"; exit 1; }
          node -e '
            const [minos, min] = process.argv.slice(1).map((v) => v.split(".").map(Number));
            for (let i = 0; i < 3; i++) {
              const d = (minos[i] || 0) - (min[i] || 0);
              if (d) process.exit(d > 0 ? 1 : 0);
            }
          ' "$minos" "$MIN" || { echo "::error::ffmpeg's minos $minos is above the app's LSMinimumSystemVersion $MIN"; exit 1; }
          [ "$(lipo -archs "$ff")" = arm64 ] || { echo "::error::ffmpeg is not an arm64 binary"; exit 1; }
          if "$ff" -hide_banner -version | grep -E -- '--enable-(gpl|nonfree|version3)'; then
            echo "::error::ffmpeg is configured beyond LGPL 2.1"; exit 1
          fi
          "$ff" -hide_banner -encoders | grep libmp3lame || { echo "::error::ffmpeg has no libmp3lame encoder"; exit 1; }
          "$ff" -hide_banner -protocols | grep -x '[[:space:]]*https' || { echo "::error::ffmpeg has no https protocol"; exit 1; }
          "$ff" -hide_banner -decoders | grep -E '^ [A-Z.]{6} zlib ' || { echo "::error::ffmpeg is built without zlib"; exit 1; }
          cp "$ff" "$STAGE/bin/ffmpeg"

      # After the checks, so a binary that failed them is never the one a later run restores.
      - name: Save the ffmpeg build
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ffmpeg-build/out
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}

      # Unpinned, as on Windows. yt-dlp_macos is the universal single-file build.
      - name: Download yt-dlp
        run: |
          set -eux
          curl -fsSL --retry 5 --retry-delay 10 -o "$STAGE/bin/yt-dlp" https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
          chmod +x "$STAGE/bin/yt-dlp" "$STAGE/bin/ffmpeg"
          ls -l "$STAGE/bin"
          file "$STAGE"/bin/*

      - name: Write credentials.json
        env:
          CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          if [ -z "$CREDENTIALS" ]; then
            echo "::error::GOOGLE_CREDENTIALS_JSON secret is empty or unset — set it to the Google OAuth client JSON; a build without it cannot connect Google Drive"
            exit 1
          fi
          printf '%s' "$CREDENTIALS" > backend/credentials.json
          echo "credentials.json written"

      # The stock wheel's bootloader: the Windows job compiles its own only because of Defender.
      # PyInstaller ad-hoc signs what it collects; electron-builder signs the whole bundle again.
      - name: Freeze backend and database
        working-directory: backend
        run: |
          set -eux
          uv run --with "pyinstaller==$PYINSTALLER_VERSION" pyinstaller ../delivery/services.spec
          file dist/services/faststudy-services
          [ "$(lipo -archs dist/services/faststudy-services)" = arm64 ] || { echo "::error::faststudy-services is not an arm64 binary"; exit 1; }

      # Built again rather than passed from the Windows job, with the same inputs; on main both
      # uploads land in the one faststudy@<version> release.
      - name: Build the frontend
        working-directory: frontend
        env:
          FASTSTUDY_VERSION: ${{ needs.build.outputs.version }}
          SENTRY_AUTH_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.SENTRY_AUTH_TOKEN || '' }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          VITE_SENTRY_DSN: ${{ secrets.FASTSTUDY_SENTRY_DSN }}
        run: npm ci && npm run build

      - name: Install the Node services
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: (cd downloader && npm ci --omit=dev --no-audit --no-fund)

      - name: Wait for the LaTeX cache prime
        run: |
          done="$RUNNER_TEMP/prime.exit"
          deadline=$((SECONDS + 2400))
          until [ -f "$done" ] || [ "$SECONDS" -ge "$deadline" ]; do sleep 5; done
          cat "$RUNNER_TEMP/prime.log"
          [ -f "$done" ] || { echo "::error::the LaTeX cache prime did not finish within 40 minutes"; exit 1; }
          code=$(cat "$done")
          [ "$code" = 0 ] || { echo "::error::the LaTeX cache prime exited $code"; exit 1; }

      - name: Save the LaTeX cache
        if: steps.latex-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.STAGE }}/latex
          key: ${{ steps.latex-cache.outputs.cache-primary-key }}

      - name: Assemble the resources tree
        run: |
          set -eux
          node delivery/stage.mjs "$STAGE" "${{ needs.build.outputs.extension }}"
          du -sh "$STAGE"/* "$STAGE"/bin/*

      # Everything is staged before this: electron-builder seals the bundle, so a file changed
      # afterwards breaks its signature. `${dsn[@]+...}` because macOS's bash 3.2 trips `set -u` on an empty array.
      - name: Build the app
        working-directory: electron
        env:
          SENTRY_DSN: ${{ secrets.FASTSTUDY_SENTRY_DSN }}
        run: |
          set -eu
          dsn=()
          [ -n "$SENTRY_DSN" ] && dsn=("-c.extraMetadata.sentryDsn=$SENTRY_DSN")
          npm run dist:mac -- "-c.extraMetadata.version=${{ needs.build.outputs.version }}" ${dsn[@]+"${dsn[@]}"}
          ls -l dist
          cat dist/latest-mac.yml

      # The dmg is what a user downloads; the zip and latest-mac.yml are the updater's feed.
      - name: Check the build's files and its update feed config
        env:
          MIN: ${{ steps.macos.outputs.min }}
        run: |
          set -eux
          for file in FastStudy-mac-arm64.dmg FastStudy-mac-arm64.zip latest-mac.yml; do
            [ -f "electron/dist/$file" ] || { echo "::error::electron-builder wrote no dist/$file"; ls -l electron/dist; exit 1; }
          done
          grep -qx "version: ${{ needs.build.outputs.version }}" electron/dist/latest-mac.yml
          grep -q 'FastStudy-mac-arm64\.zip' electron/dist/latest-mac.yml
          yml="$APP/Contents/Resources/app-update.yml"
          [ -f "$yml" ] || { echo "::error::electron-builder wrote no $yml"; exit 1; }
          for line in "provider: github" "owner: ShalomPrinz" "repo: fast-study"; do
            grep -qx "$line" "$yml" || { echo "::error::$yml has no '$line'"; cat "$yml"; exit 1; }
          done
          built=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")
          [ "$built" = "$MIN" ] || { echo "::error::the built app's LSMinimumSystemVersion is $built, but ffmpeg was built for $MIN"; exit 1; }
          for tool in bin/ffmpeg bin/pandoc bin/tectonic bin/yt-dlp services/faststudy-services; do
            [ -x "$APP/Contents/Resources/$tool" ] || { echo "::error::$tool lost its exec bit in the bundle"; ls -l "$APP/Contents/Resources/$(dirname "$tool")"; exit 1; }
          done

      # Unsigned code does not run on arm64 macOS: the bundle's seal, then every Mach-O inside it.
      - name: Check every signature
        run: |
          set -eux
          codesign -dvv "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          node delivery/smoke/lib/macho.js "$APP"

      # What codesign judges a nested bundle by: each one's root and Versions/, and every absolute
      # symlink, in the stage and in the built app.
      - name: Show the bundle layouts after a failure
        if: failure()
        run: |
          for root in "$STAGE" "$APP"; do
            [ -d "$root" ] || continue
            echo "::group::$root"
            find "$root" -type d \( -name '*.framework' -o -name '*.app' \) | while read -r dir; do
              ls -la "$dir" "$dir/Versions" 2>/dev/null || true
            done
            echo "absolute symlinks:"
            find "$root" -type l -lname '/*' -exec ls -l {} +
            echo "::endgroup::"
          done

      # Measured sizes, in the run summary: what the macOS download and each tool in it weigh.
      - name: Report sizes
        run: |
          {
            echo '### macOS build sizes'
            echo '```'
            ls -l electron/dist/FastStudy-mac-arm64.dmg electron/dist/FastStudy-mac-arm64.zip
            du -sh "$APP" "$APP"/Contents/Resources/* "$APP"/Contents/Resources/bin/*
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The same staged tree at a lower version, for the smoke job's update check; only its zip is used.
      - name: Build the previous-version app
        working-directory: electron
        env:
          SENTRY_DSN: ${{ secrets.FASTSTUDY_SENTRY_DSN }}
        run: |
          set -eu
          dsn=()
          [ -n "$SENTRY_DSN" ] && dsn=("-c.extraMetadata.sentryDsn=$SENTRY_DSN")
          npm run dist:mac -- "-c.extraMetadata.version=${{ needs.build.outputs.previous }}" -c.directories.output=dist/previous ${dsn[@]+"${dsn[@]}"}
          ls -l dist/previous

      # The zip's blockmap stays behind: the macOS updater downloads the zip whole.
      - uses: actions/upload-artifact@v6
        with:
          name: installer-mac
          path: |
            electron/dist/FastStudy-mac-arm64.dmg
            electron/dist/FastStudy-mac-arm64.zip
            electron/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v6
        with:
          name: installer-mac-previous
          path: |
            electron/dist/previous/FastStudy-mac-arm64.zip
            electron/dist/previous/latest-mac.yml
          if-no-files-found: error

  # The smoke jobs, in smoke-suite.yml so smoke.yml can re-run them on this run's builds. Two calls,
  # so neither platform's smoke waits on the other's build.
  smoke:
    needs: build
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/smoke-suite.yml
    with:
      target: windows

  smoke-mac:
    needs: build-mac
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/smoke-suite.yml
    with:
      target: mac
