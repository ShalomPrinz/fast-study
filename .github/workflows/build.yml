name: Build and smoke-test

# Manual only. Builds the installer once, runs the release smoke suite against exactly those bytes on
# a fresh runner, and only then uploads them to a draft Release v<version>. Nothing here publishes:
# electron-updater never sees a draft, and publish.yml is the one way a draft goes live.
on:
  workflow_dispatch:

env:
  # Pinned, because each one is a claim the repo has measured. tectonic is the version the shipped
  # LaTeX cache was primed against; pandoc 3.x crashes text_direction.lua, so the binary and
  # backend/assets/templates/pandoc_template.tex only ever move together.
  TECTONIC_VERSION: "0.17.0"
  PANDOC_VERSION: "2.9.2.1"
  FFMPEG_VERSION: "8.0"
  STAGE: delivery/stage

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The tag, the installer's file name and what app.getVersion() reports; the update check's
      # second installer needs any version below it, so this refuses a version with nothing below.
      - name: Read the version
        id: version
        run: |
          version=$(node -p "require('./electron/package.json').version")
          previous=$(node -e '
            const [major, minor, patch] = process.argv[1].split(/[.-]/).map(Number);
            if (patch > 0) console.log(`${major}.${minor}.${patch - 1}`);
            else if (minor > 0) console.log(`${major}.${minor - 1}.9999`);
            else if (major > 0) console.log(`${major - 1}.9999.9999`);
            else process.exit(1);
          ' "$version") || { echo "::error::$version has no lower version to update from"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "building $version, with $previous for the update check"

      # Every external tool the app spawns, by absolute path out of FASTSTUDY_BIN_DIR at runtime.
      # curl is the one exception and ships with Windows, so it is not here. The msvc tectonic
      # build, never gnu: the gnu binary imports six MinGW DLLs its own zip does not contain.
      - name: Download the bundled binaries
        run: |
          mkdir -p "$STAGE/bin" downloads
          base=https://github.com
          curl -fsSL -o downloads/tectonic.zip "$base/tectonic-typesetting/tectonic/releases/download/tectonic%40$TECTONIC_VERSION/tectonic-$TECTONIC_VERSION-x86_64-pc-windows-msvc.zip"
          curl -fsSL -o downloads/pandoc.zip "$base/jgm/pandoc/releases/download/$PANDOC_VERSION/pandoc-$PANDOC_VERSION-windows-x86_64.zip"
          curl -fsSL -o downloads/ffmpeg.zip "$base/GyanD/codexffmpeg/releases/download/$FFMPEG_VERSION/ffmpeg-$FFMPEG_VERSION-essentials_build.zip"
          # Unpinned on purpose: yt-dlp rots as YouTube changes signatures, so a build ships the
          # newest one and the app self-updates from there.
          curl -fsSL -o "$STAGE/bin/yt-dlp.exe" "$base/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
          for zip in tectonic pandoc ffmpeg; do 7z x -y -o"downloads/$zip" "downloads/$zip.zip" > /dev/null; done
          cp downloads/tectonic/tectonic.exe "$STAGE/bin/"
          cp "downloads/pandoc/pandoc-$PANDOC_VERSION/pandoc.exe" "$STAGE/bin/"
          cp "downloads/ffmpeg/ffmpeg-$FFMPEG_VERSION-essentials_build/bin/ffmpeg.exe" "$STAGE/bin/"
          cp "downloads/ffmpeg/ffmpeg-$FFMPEG_VERSION-essentials_build/bin/ffprobe.exe" "$STAGE/bin/"
          ls -l "$STAGE/bin"

      # The one build input that is not committed: it is gitignored so the client secret never
      # faces GitHub's secret scanning. A build without the secret still has to produce a bundle —
      # services.spec ships it conditionally — it just ships without Drive consent.
      - name: Write credentials.json
        env:
          CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          if [ -n "$CREDENTIALS" ]; then
            printf '%s' "$CREDENTIALS" > backend/credentials.json
            echo "credentials.json written"
          else
            echo "no GOOGLE_CREDENTIALS_JSON secret — building without Drive consent"
          fi

      # One one-dir bundle holding both Python services, selected by argv[1]. Built out of
      # backend/'s environment, which works only because database/'s dependencies are a strict
      # subset of backend/'s.
      - name: Freeze backend and database
        working-directory: backend
        run: uv run --with pyinstaller pyinstaller ../delivery/services.spec

      - name: Build the frontend
        working-directory: frontend
        run: npm ci && npm run build

      # --install-links, not the default symlink: the file:../../lib/*/js deps have to be real
      # directories or they dangle the moment the tree is copied into the installer.
      # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD keeps a 364MB Chromium the app never launches — every
      # launch resolves channel:'chrome' or 'msedge' — out of the installer.
      - name: Install the Node services
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          # Each in a subshell rather than `npm --prefix`: run from the repo root, npm would pick up
          # the root package.json's `lib/*/js` workspaces instead of the service's own tree.
          (cd downloader/auto && npm ci --install-links --omit=dev --no-audit --no-fund)
          (cd downloader/server && npm ci --install-links --omit=dev --no-audit --no-fund)

      # Network-bound, ~7.5 minutes. tectonic fetches each LaTeX package on first use and the
      # shipped app renders --only-cached, so anything missing here is an unfixable failed render
      # on a user's machine.
      - name: Prime the LaTeX cache
        working-directory: backend
        env:
          FASTSTUDY_BIN_DIR: ${{ github.workspace }}/delivery/stage/bin
        run: uv run python ../delivery/prime_cache.py "../$STAGE/latex"

      - name: Assemble the resources tree
        run: node delivery/stage.mjs "$STAGE"

      # `dist` lives in electron/package.json with the publish block that writes app-update.yml and
      # latest.yml; --publish never is in the script, so this step can upload nothing.
      - name: Build the installer
        working-directory: electron
        run: npm ci && npm run dist

      # The smoke job rewrites app-update.yml to a loopback feed, so this is the only check that the
      # shipped copy points installed apps at this repo's Releases.
      - name: Check the update feed config
        run: |
          yml=electron/dist/win-unpacked/resources/app-update.yml
          [ -f "$yml" ] || { echo "::error::electron-builder wrote no $yml"; exit 1; }
          for line in "provider: github" "owner: ShalomPrinz" "repo: fast-study"; do
            grep -qx "$line" <(tr -d '\r' < "$yml") || { echo "::error::$yml has no '$line'"; cat "$yml"; exit 1; }
          done

      # The same staged tree at a lower version, so the smoke job can update from it to the build
      # above. Its own output dir keeps its latest.yml off the candidate's; it never leaves Actions.
      - name: Build the previous-version installer
        working-directory: electron
        run: npm run dist -- "-c.extraMetadata.version=${{ steps.version.outputs.previous }}" -c.directories.output=dist/previous

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            electron/dist/FastStudy-Setup-${{ steps.version.outputs.version }}.exe
            electron/dist/FastStudy-Setup-${{ steps.version.outputs.version }}.exe.blockmap
            electron/dist/latest.yml
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: installer-previous
          path: electron/dist/previous/FastStudy-Setup-${{ steps.version.outputs.previous }}.exe
          if-no-files-found: error

  # A fresh runner, so the install is a first install. It installs and tests the uploaded artifact,
  # which is byte for byte what the draft job below attaches.
  smoke:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 150
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: ${{ runner.temp }}/installer

      - uses: actions/download-artifact@v4
        with:
          name: installer-previous
          path: ${{ runner.temp }}/installer-previous

      # The suite's own dependencies, locked in delivery/smoke; none of it reaches resources/.
      - name: Install the smoke suite
        working-directory: delivery/smoke
        run: npm ci --no-audit --no-fund

      - name: Run the smoke suite
        working-directory: delivery/smoke
        env:
          SMOKE_CANDIDATE_DIR: ${{ runner.temp }}/installer
          SMOKE_PREVIOUS_DIR: ${{ runner.temp }}/installer-previous
        run: npx playwright test

      # The suite copies each launch's launch.log as it quits; this catches the one a crash left.
      - name: Collect the state root's logs
        if: failure()
        shell: pwsh
        run: Copy-Item "$env:LOCALAPPDATA\FastStudy\logs" delivery/smoke/test-results/state-logs -Recurse -ErrorAction SilentlyContinue

      # Two artifacts, because the traces are ~11MB of the ~11MB and the text is what gets read.
      # Everything but the traces, so a new diagnostic file rides along without a pattern change.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-logs
          path: |
            delivery/smoke/test-results/
            !delivery/smoke/test-results/traces/**

      # Screenshots and DOM snapshots for a failed UI assertion; absent when the failure preceded
      # the first launch, which is a normal outcome and not worth an annotation.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-traces
          path: delivery/smoke/test-results/traces/
          if-no-files-found: ignore

  # Attaches the tested files, never rebuilt ones, and never publishes. A rebuild of the same version
  # replaces the draft's files and re-targets it at this commit.
  draft:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared with publish.yml, so a draft is never rewritten while it is being flipped live.
    concurrency:
      group: release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.build.outputs.version }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: installer

      - name: Upload to the draft Release
        run: |
          files=(installer/*)
          if view=$(gh release view "$TAG" --json isDraft 2> view.err); then
            if [ "$(jq -r .isDraft <<< "$view")" != "true" ]; then
              echo "::error::$TAG is already published; bump electron/package.json's version and rebuild"
              exit 1
            fi
            gh release edit "$TAG" --target "$GITHUB_SHA"
            for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              gh release delete-asset "$TAG" "$asset" --yes
            done
            gh release upload "$TAG" "${files[@]}"
            echo "replaced the files of draft $TAG, now targeting $GITHUB_SHA"
          elif grep -q "release not found" view.err; then
            gh release create "$TAG" "${files[@]}" --draft --target "$GITHUB_SHA" --title "$TAG" --notes ""
            echo "created draft $TAG targeting $GITHUB_SHA"
          else
            cat view.err
            exit 1
          fi
